# Tympan 2.8.1 : configuration nginx (fichiers statiques uniquement)
# Copiez index.html dans /var/www/tympan, en lecture seule (chown root:root, chmod 444).
server {
    listen 443 ssl http2;
    server_name tympan.example.org;              # à adapter
    # ssl_certificate     /etc/letsencrypt/live/tympan.example.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tympan.example.org/privkey.pem;

    root /var/www/tympan;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1k;                   # aucune donnée n'est jamais envoyée au serveur

    location = /index.html { limit_except GET HEAD { deny all; } }
    location = / { limit_except GET HEAD { deny all; } try_files /index.html =404; }
    location / { return 404; }                 # rien d'autre n'est servi

    # Seul le script intégré (empreinte ci-dessous) et les polices IBM Plex sont autorisés,
    # aucune connexion réseau sortante.
    add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-3VnwVlb5OdcpfNIrp2XfrlqVD0gntpuRqX5hpRUFFrY='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

server {
    listen 80;
    server_name tympan.example.org;
    return 301 https://$host$request_uri;
}
